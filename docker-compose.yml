services:
  web:
    build: .
    image: coring-data-web:demo
    container_name: coring-data-web
    ports:
      - "8000:8000"
    volumes:
      - coring_data:/data
    environment:
      APP_DATA_DIR: /data
      APP_SEED_DEMO: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  coring_data:
